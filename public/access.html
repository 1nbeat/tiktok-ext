<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>访问验证 · 抖音下载助手</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f5f6;color:#20252b;font-family:system-ui,"Microsoft YaHei",sans-serif}.login{width:min(400px,calc(100% - 32px));padding:36px;background:#fff;border:1px solid #e2e6e9;border-radius:8px;box-shadow:0 12px 40px #1a273010}.mark{display:grid;place-items:center;width:40px;height:40px;background:#22272d;color:#fff;border-radius:7px;font-weight:700;font-size:20px}h1{font-size:22px;margin:24px 0 8px}p{color:#75808a;font-size:14px;margin:0 0 24px}label{display:block;font-size:13px;font-weight:600;margin-bottom:8px}input{width:100%;height:44px;border:1px solid #cdd5dc;border-radius:6px;padding:0 12px;font:inherit}input:focus{outline:2px solid #fe2c5555;border-color:#fe2c55}button{width:100%;height:44px;margin-top:18px;border:0;border-radius:6px;background:#e62e51;color:#fff;font-size:14px;font-weight:600;cursor:pointer}.error{color:#b42140;font-size:13px;margin:12px 0 0}
  </style>
</head>
<body>
  <main class="login">
    <div class="mark" aria-hidden="true">D</div>
    <h1>抖音下载助手</h1>
    <p>请输入访问密码</p>
    <form action="/access/login" method="post">
      <label for="password">访问密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <p class="error" id="error" hidden>密码不正确，请重试</p>
      <button type="submit">进入</button>
    </form>
  </main>
  <script>document.getElementById('error').hidden = !new URLSearchParams(location.search).has('error');</script>
</body>
</html>
